name: Temporary verified root simplification
on:
  push:
    branches: [feat/simplify-root-v0.3.0]
    paths: ['.github/workflows/root-migration.yml']
permissions:
  contents: read
jobs:
  migrate:
    if: github.repository == 'xiongxianfei/ai-coach-kps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify source bytes and apply the reviewed migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          paths=[Path(".root-build")/f"part{x}.b64" for x in ("1","2","3a","3b")]
          parts=[p.read_text(encoding="ascii").strip() for p in paths]
          assert [len(s) for s in parts]==[3916,3916,1958,1958]
          script=gzip.decompress(base64.b64decode("".join(parts),validate=True))
          expected="e5c426566bea60e606c42eb26fcdd98f62427e871b608946573faf6fc124bed9"
          assert hashlib.sha256(script).hexdigest()==expected, "migration payload differs from locally reviewed bytes"
          Path(".migration.py").write_bytes(script)
          PY
          python3 .migration.py
          rm .migration.py
          git rm -r --ignore-unmatch .root-build .github/workflows/root-migration.yml
          python3 validate.py . --accept-reviewed-summaries
          python3 validate.py .
          python3 test_validate.py
          python3 tools/check_domain.py
          python3 tools/build_navigation.py --check
          python3 -m unittest discover -s tests -v
      - name: Commit only the verified final package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: simplify AI Coach KPS root and retain Core compatibility'
          git push origin HEAD:refs/heads/feat/simplify-root-v0.3.0
