name: Temporary AI Coach package materialization
on:
  push:
    branches: [feat/adult-learning-coaching]
    paths: ['.coach-build/**']
permissions:
  contents: read
concurrency:
  group: ai-coach-initial-materialization
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'xiongxianfei/ai-coach-kps'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Materialize hash checked content and repeat publication tests
        run: python3 .coach-build/apply.py
      - name: Commit only tested content to implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .coach-build
          git add -- . ':!.github/workflows'
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Unexpected workflow mutation in content commit'; exit 1
          fi
          git commit -m 'feat: add source-aligned adult AI learning coaching package'
          git push origin HEAD:refs/heads/feat/adult-learning-coaching
