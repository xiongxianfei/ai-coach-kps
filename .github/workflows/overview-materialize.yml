name: Temporary two level overview materialization
on:
  push:
    branches: [feat/two-level-overview]
    paths: ['.overview-build/**']
permissions:
  contents: read
concurrency:
  group: two-level-overview-materialization
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'xiongxianfei/ai-coach-kps'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Verify reviewed bytes and all publication checks
        run: python3 .overview-build/apply.py
      - name: Commit checked files only to implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .overview-build
          git commit -m 'feat: integrate two-level concept maps and adaptive instructional sequencing'
          git push origin HEAD:refs/heads/feat/two-level-overview
