name: Temporary overview source export
on:
  push:
    branches: [feat/two-level-overview]
    paths: ['.github/workflows/overview-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cad097501b0a6702ab874807ac1bd3202a13896f
          persist-credentials: false
      - name: Archive pinned public source
        run: git archive --format=zip --output=overview-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: overview-source
          path: overview-source.zip
          retention-days: 1
          if-no-files-found: error
