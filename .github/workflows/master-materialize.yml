name: Temporary master Practice materialization
on:
  push:
    branches: [feat/master-learning-orchestration]
    paths: ['.master-build/**']
permissions:
  contents: read
concurrency:
  group: master-practice-materialization
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'xiongxianfei/ai-coach-kps'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact reviewed files and publication checks
        run: python3 .master-build/apply.py
      - name: Commit only the validated implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add self-contained master AI learning orchestration Practice'
          git push origin HEAD:refs/heads/feat/master-learning-orchestration
